name: CI
run-name: 'CI checks for PR #${{ github.event.pull_request.number || github.ref_name }}'

on:
  push: # Triggers on any commit pushed to ANY branch or tag
  pull_request: # Triggers on any PR opened, updated (synchronize), or reopened
  workflow_dispatch: # Adds a "Run workflow" button in GitHub UI for manual runs


permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run db:generate
      - run: npm run check
      - run: npm run lint
      - run: npm run build
