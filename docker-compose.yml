services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    init: true
    environment:
      DOCKER_DEV: '1'
    ports:
      - '${APP_PORT:-5173}:5173'
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_sveltekit:/app/.svelte-kit
      - app_pnpm_store:/pnpm/store

volumes:
  app_node_modules:
  app_sveltekit:
  app_pnpm_store:
